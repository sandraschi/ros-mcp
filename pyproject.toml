[project]
name = "ros-mcp"
version = "0.1.0"
description = "ROS 2 CLI wrapper via MCP — introspect topics, services, nodes, and lifecycle"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pytest>=8",
]

[project.scripts]
ros-mcp = "ros_mcp:main"
